{% extends 'main/base.html' %}

{% block title %}Word Frequency{% endblock %}

{% block content %}
<h2>Word Frequency: {{ document.title }}</h2>

<form method="get" class="mb-3">
    <div class="form-check">
        <input type="checkbox" class="form-check-input" id="corrected" name="corrected" value="1"
               {% if corrected %}checked{% endif %} onchange="this.form.submit()">
        <label class="form-check-label" for="corrected">Show corrected text</label>
    </div>
</form>

<table class="table">
  <tr>
    <th>Word</th>
    <th>Count</th>
  </tr>

  {% for word, count in frequencies %}
  <tr>
    <td>{{ word }}</td>
    <td>{{ count }}</td>
  </tr>
  {% endfor %}
</table>

<a href="{% url 'corpus_dashboard' %}" class="btn btn-outline-secondary mb-3">
    ← Back to Corpus
</a>

{% endblock %}
