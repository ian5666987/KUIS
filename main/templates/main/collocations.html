{% extends 'main/base.html' %}

{% block content %}
<h2>Collocations</h2>

{% include 'main/_corpus_selector.html' %}

<form method="get" class="mb-3">
    <div class="form-check">
        <input type="checkbox" class="form-check-input" id="corrected" name="corrected" value="1"
               {% if corrected %}checked{% endif %} onchange="this.form.submit()">
        <label class="form-check-label" for="corrected">Show corrected text</label>
    </div>
</form>

<table class="table">
<tr>
  <th>Word Pair</th>
  <th>Count</th>
</tr>

{% for pair, count in collocations %}
<tr>
  <td>{{ pair.0 }} {{ pair.1 }}</td>
  <td>{{ count }}</td>
</tr>
{% endfor %}
</table>

<a href="{% url 'analysis_home' %}" class="btn btn-outline-secondary mb-3">
    ← Back to Analysis
</a>

{% endblock %}
