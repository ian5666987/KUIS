{% extends 'main/base.html' %}

{% block content %}
<h2>{{ n }}-grams</h2>

{% include 'main/_corpus_selector.html' %}

<form method="get" class="mb-3 d-flex align-items-center gap-3">
    <div>
        <label for="n" class="form-label mb-0">N-gram size:</label>
        <select name="n" id="n" class="form-select w-auto d-inline-block" onchange="this.form.submit()">
            {% for size in ngram_sizes %}
            <option value="{{ size }}" {% if size == n %}selected{% endif %}>{{ size }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-check mb-0">
        <input type="checkbox" class="form-check-input" id="corrected" name="corrected" value="1"
               {% if corrected %}checked{% endif %} onchange="this.form.submit()">
        <label class="form-check-label" for="corrected">Show corrected text</label>
    </div>
</form>

<table class="table">
<tr>
  <th>N-gram</th>
  <th>Count</th>
</tr>

{% for gram, count in ngrams %}
<tr>
  <td>{{ gram|join:" " }}</td>
  <td>{{ count }}</td>
</tr>
{% endfor %}
</table>

<a href="{% url 'analysis_home' %}" class="btn btn-outline-secondary mb-3">
    ← Back to Analysis
</a>

{% endblock %}
