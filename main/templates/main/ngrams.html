{% extends 'main/base.html' %}

{% block content %}
<h2>{{ n }}-grams: {{ document.title }}</h2>

<table class="table">
<tr>
  <th>N-gram</th>
  <th>Count</th>
</tr>

{% for gram, count in ngrams %}
<tr>
  <td>{{ gram|join:" " }}</td>
  <td>{{ count }}</td>
</tr>
{% endfor %}
</table>

<a href="{% url 'corpus_dashboard' %}" class="btn btn-outline-secondary mb-3">
    ← Back to Corpus
</a>

{% endblock %}
