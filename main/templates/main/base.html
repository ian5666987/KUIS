<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Site{% endblock %}</title>
    <!--Bootstrap should be put in the head-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="bg-dark p-3">
        <a class="nav-link d-inline text-white" href="{% url 'home' %}">Home</a> |
        <a class="nav-link d-inline text-white" href="{% url 'about' %}">About</a> |
        <a class="nav-link d-inline text-white" href="{% url 'contact' %}">Contact</a> |

     {% if user.is_authenticated %}
        <a class="nav-link d-inline text-white" href="{% url 'dashboard' %}">Dashboard</a> |
        <a class="nav-link d-inline text-white" href="{% url 'corpus_dashboard' %}">Corpus</a> |      
        <a class="nav-link d-inline text-white" href="{% url 'profile' %}">Profile</a> |
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-link nav-link d-inline p-0 m-0 align-baseline text-white">
                Logout
            </button>
        </form>    
      {% else %}
        <a class="nav-link d-inline text-white" href="{% url 'login' %}">Login</a> |
        <a class="nav-link d-inline text-white" href="{% url 'register' %}">Register</a> |
      {% endif %}
    </nav>
    <hr>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
