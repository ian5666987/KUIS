name: Build & Deploy KUIS

# Same shape as identity-service-internal/.github/workflows/deploy.yml,
# generalized to a build matrix over 3 images from this one repo (Django,
# FastAPI, worker — architecture plan §7).
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: deploy-kuis
  cancel-in-progress: false # never interrupt a deploy midway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR
    strategy:
      matrix:
        service: [django, fastapi, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64 # VPS is amd64; a local arm64 dev machine needs this pinned
          push: true
          tags: |
            ghcr.io/indo-leksia/kuis-${{ matrix.service }}:latest
            ghcr.io/indo-leksia/kuis-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build # only deploy if every image built & pushed
    if: ${{ github.event_name == 'workflow_dispatch' }} # deploy ONLY when manually triggered
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/platform
            docker compose pull kuis-django kuis-fastapi kuis-worker
            docker compose up -d kuis-django kuis-fastapi kuis-worker
            docker image prune -f
